<!DOCTYPE html>
<html lang="en" data-role="admin">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Something went wrong | OfficeOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<main class="auth" style="grid-template-columns: 1fr;">
  <section class="auth__panel">
    <div class="auth__inner">
      <div class="card">
        <div class="empty">
          <div class="empty__icon">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0"/></svg>
          </div>
          <span class="badge badge--danger badge--square">Error 500</span>
          <h1 class="empty__title">Something went wrong on our side</h1>
          <p class="empty__text">The page couldn't be loaded. Your data is safe. Try again in a moment. If it keeps happening, tell an Admin and share the reference below.</p>
          <code>REF-7F3A-2291</code>
          <div class="btn-group">
            <button class="btn" type="button" onclick="location.reload()">Try again</button>
            <a class="btn btn--primary" href="../dashboard/admin.html">Go to dashboard</a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

  <script type="module" src="../../assets/js/app.js"></script>
</body>
</html>
